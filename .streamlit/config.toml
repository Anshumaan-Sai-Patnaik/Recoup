# Streamlit configuration for the demo dashboard.
#
# The theme is pinned to light rather than left to follow the viewer's browser, for two
# reasons. First, this is built to be shown on a projector in a lit room, where a dark
# theme washes out. Second — and the reason it is worth a config file rather than a
# preference — the chart colours in dashboard/app.py were validated for contrast and
# colour-blind separation *against a specific surface colour*. A palette checked against a
# light surface and then rendered on a dark one is no longer a checked palette. Pinning the
# theme means the surface those colours were tested on is the surface they are drawn on.

[theme]
base = "light"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f2"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[runner]
# Streamlit's "magic" prints any bare value left on its own line in the entrypoint
# script. Python's attribute-documentation convention — a string literal placed under a
# constant to explain it — is exactly that shape, and Streamlit's own guard only exempts
# the *first* string in a file (`_is_docstring_node`: `node_index == 0`). Every note under
# every constant in dashboard/app.py was therefore being rendered onto the page, above the
# title, before a run: ten paragraphs of internal commentary about label maps and colour
# palettes. Disabled here rather than by rewriting those notes as `#` comments, because
# this closes the whole class — the eleventh note somebody writes is safe too. Nothing in
# this app relies on magic: every element it means to display is an explicit `st.` call,
# and the only bare top-level expressions are function calls, which magic leaves alone.
magicEnabled = false
